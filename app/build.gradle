plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cosmo.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cosmo.assistant'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // Package only architectures supplied by both Vosk and JNA.
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    packaging {
        jniLibs.useLegacyPackaging = false
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Android 16's Robolectric shared-memory shadow uses the JDK descriptor accessor.
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED'
        }
    }
    androidResources {
        noCompress += ['zip']
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
